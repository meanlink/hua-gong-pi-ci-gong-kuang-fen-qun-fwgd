<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨厂联合分群试验台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>跨厂联合分群试验台</h1>
    <p class="sub">原始工况不离站 · 仅交换标准化与迭代分群汇总 · 站点批次与贡献全程可追溯</p>
  </div>
  <div class="top-actions">
    <button id="btn-refresh" class="btn">刷新</button>
    <label class="auto"><input type="checkbox" id="auto-refresh" checked> 2秒自动刷新</label>
  </div>
</header>

<main class="layout">
  <section class="card">
    <h2>① 建立联合试验</h2>
    <p class="hint">启动后参与站、数据指纹与分群数 K 立即固定；同轮汇总齐备才推进，缺席不按零贡献计。</p>
    <form id="form-trial">
      <label>试验名称<input name="name" value="2026Q4 跨厂工况联合分群" required></label>
      <div class="grid3">
        <label>分群数 K（2~6）<input name="k" type="number" min="2" max="6" value="3" required></label>
        <label>最大迭代轮次<input name="max_rounds" type="number" min="1" max="100" value="20"></label>
        <label>收敛阈值（中心位移）<input name="tol" type="number" step="0.00001" value="0.0001"></label>
      </div>
      <label>固定参与站 URL（每行一个，启动后不可增减）
        <textarea name="station_urls" rows="3">http://127.0.0.1:8071
http://127.0.0.1:8072
http://127.0.0.1:8073</textarea></label>
      <div class="row-actions">
        <button class="btn primary" type="submit">创建试验</button>
        <button class="btn" type="button" id="btn-start-selected">登记完成后启动所选试验</button>
      </div>
    </form>
    <h3>本地站点故障模拟（页面代理下发，无需登录站点主机）</h3>
    <div id="station-console" class="station-console"><p class="hint">暂无站点信息。</p></div>
  </section>

  <section class="card">
    <h2>② 试验列表与迭代进度</h2>
    <div id="trial-list" class="trial-list"><p class="hint">加载中…</p></div>
  </section>

  <section class="card hidden" id="detail-card">
    <div class="detail-head">
      <h2>③ 试验详情 <span id="d-trial-id" class="mono"></span></h2>
      <button class="btn small" id="btn-close-detail">关闭详情</button>
    </div>
    <div id="detail-body"></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
